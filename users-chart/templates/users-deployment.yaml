apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: {{ printf "%s:%s" .Values.usersBack.image .Values.usersBack.tag }}
          ports:
            - containerPort: {{ .Values.usersBack.containerPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: DD_SERVICE
              value: "users-backend"
            - name: DD_ENV
              value: {{ .Values.dd.env | quote }}
            - name: DD_VERSION
              value: {{ .Values.usersBack.tag | quote }}
            - name: DD_AGENT_HOST
              value: "datadog-agent.datadog.svc.cluster.local"