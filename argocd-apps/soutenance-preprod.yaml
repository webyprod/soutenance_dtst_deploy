apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soutenance-preprod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/webyprod/soutenance_dtst_deploy.git
    targetRevision: preprod
    path: users-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
